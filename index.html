<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Задачи и заметки</title>
<script>
  // Тему ставим сразу, до отрисовки страницы, чтобы не мигал белый экран
  (function () {
    var t = null;
    try { t = localStorage.getItem('notes_tasks_theme'); } catch (e) {}
    if (t !== 'dark' && t !== 'light') {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  /* ---------- Цвета светлой и тёмной темы ---------- */
  :root {
    --bg: #f3f3f3;
    --card: #ffffff;
    --card-hover: #fafafa;
    --text: #1c1c1c;
    --muted: #6b6b6b;
    --line: #e2e2e2;
    --field: #ffffff;
    --field-line: #c9c9c9;
    --accent: #f2b200;        /* жёлтый, как в заметках Xiaomi */
    --accent-hover: #ffc21a;
    --on-accent: #1c1c1c;     /* текст на жёлтом */
    --tag-bg: #fff3cc;
    --tag-text: #6b4e00;
    --danger: #c62828;
    --danger-soft: #fdecea;
    --warn: #a35f00;
    --warn-soft: #fff1dc;
    --shadow: 0 1px 3px rgba(0, 0, 0, .07);
  }
  [data-theme="dark"] {
    --bg: #000000;
    --card: #1e1e1e;
    --card-hover: #262626;
    --text: #ededed;
    --muted: #9a9a9a;
    --line: #2e2e2e;
    --field: #141414;
    --field-line: #3d3d3d;
    --accent: #f5bd00;
    --accent-hover: #ffcb2e;
    --on-accent: #1c1c1c;
    --tag-bg: #3a3215;
    --tag-text: #f2d374;
    --danger: #ff7b72;
    --danger-soft: #3a1d1c;
    --warn: #f3b552;
    --warn-soft: #3a2c14;
    --shadow: none;
    color-scheme: dark;
  }

  /* ---------- Общие настройки ---------- */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 16px;
    color: var(--text);
    background: var(--bg);
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 0 16px; }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid transparent; padding: 9px 16px; }
  input[type=text], input[type=date], select, textarea {
    font: inherit; padding: 10px 12px; border: 1px solid var(--field-line); border-radius: 10px;
    background: var(--field); color: var(--text);
  }
  input:focus, select:focus, textarea:focus, button:focus-visible, .card:focus-visible, .task:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }

  /* ---------- Шапка и вкладки ---------- */
  .top { padding-top: 18px; }
  .toprow { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  h1 { margin: 0; font-size: 30px; font-weight: 600; }
  #themeBtn { background: transparent; border: 1px solid var(--field-line); color: var(--text); padding: 7px 12px; font-size: 14px; }
  #themeBtn:hover { background: var(--card); }
  .tabs { display: flex; gap: 6px; margin: 16px 0 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 5px; }
  .tabs button { flex: 1; background: transparent; color: var(--muted); font-weight: 600; font-size: 17px; padding: 10px; }
  .tabs button.active { background: var(--accent); color: var(--on-accent); }
  .tabs button:not(.active):hover { color: var(--text); }
  .tabs .num { font-weight: 400; opacity: .8; }

  /* ---------- Панель: поиск, категории, сортировка ---------- */
  .tools { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  #search { flex: 2; min-width: 200px; }
  .tools select { flex: 1; min-width: 150px; }
  .addrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin: 4px 0 14px; }
  #addBtn { background: var(--accent); color: var(--on-accent); font-weight: 600; padding: 11px 20px; }
  #addBtn:hover { background: var(--accent-hover); }
  #shown { font-size: 14px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chips button { background: var(--card); border-color: var(--line); color: var(--text); padding: 6px 14px; border-radius: 20px; font-size: 15px; }
  .chips button.active { background: var(--text); border-color: var(--text); color: var(--bg); }
  #warning { background: var(--warn-soft); border: 1px solid var(--warn); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; display: none; }

  /* ---------- Заметки: плитка ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; padding-bottom: 40px; }
  .card { background: var(--card); border-radius: 16px; padding: 16px; cursor: pointer; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; min-height: 110px; }
  .card:hover { background: var(--card-hover); }
  .card .title { font-weight: 600; font-size: 18px; overflow-wrap: anywhere; }
  .card .text { color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
  .card .meta { margin-top: auto; }

  /* ---------- Задачи: список ---------- */
  .tasklist { display: flex; flex-direction: column; gap: 8px; padding-bottom: 40px; }
  .task { background: var(--card); border-radius: 14px; padding: 13px 14px; display: flex; gap: 12px; align-items: flex-start; cursor: pointer; box-shadow: var(--shadow); }
  .task:hover { background: var(--card-hover); }
  .task input[type=checkbox] { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
  .task .body { flex: 1; min-width: 0; }
  .task .title { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
  .task .text { color: var(--muted); font-size: 14px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task.done .title { text-decoration: line-through; color: var(--muted); }
  .task.overdue { box-shadow: inset 4px 0 0 var(--danger); }

  .meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 5px; }
  .tag { background: var(--tag-bg); color: var(--tag-text); border-radius: 10px; padding: 1px 9px; cursor: pointer; }
  .tag:hover { text-decoration: underline; }
  .due { border-radius: 10px; padding: 1px 9px; border: 1px solid var(--line); color: var(--text); }
  .due.today { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
  .due.late { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); font-weight: 600; }
  .empty { text-align: center; color: var(--muted); padding: 50px 10px; }

  /* ---------- Окно добавления и изменения ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .overlay.open { display: flex; }
  .sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 100%; overflow: auto; border-radius: 18px; padding: 18px; }
  .sheet-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .sheet-head h2 { margin: 0; font-size: 20px; font-weight: 600; flex: 1; }
  #backBtn { background: transparent; color: var(--text); border-color: var(--field-line); padding: 7px 12px; }
  .sheet input[type=text], .sheet textarea { width: 100%; display: block; margin-bottom: 10px; }
  #title { font-size: 20px; font-weight: 600; }
  #text { min-height: 160px; resize: vertical; }
  .sheet label, .sheet .label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }

  /* Хэштеги в окне */
  .tagchips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  #selTags { display: contents; }
  .chip { display: inline-flex; align-items: center; background: var(--tag-bg); color: var(--tag-text); border-radius: 16px; padding: 4px 2px 4px 12px; font-size: 15px; }
  .chip button { background: transparent; color: inherit; border: none; padding: 0 8px; font-size: 18px; line-height: 1; border-radius: 12px; }
  .chip button:hover { background: rgba(0, 0, 0, .08); }
  #addTagBtn { background: transparent; border: 1px dashed var(--field-line); color: var(--muted); border-radius: 16px; padding: 5px 14px; font-size: 15px; }
  #addTagBtn:hover { color: var(--text); border-color: var(--accent); }
  .taginput { display: none; align-items: center; border: 1px solid var(--accent); border-radius: 16px; padding: 0 6px 0 12px; background: var(--field); }
  .taginput span { color: var(--muted); }
  .sheet .taginput input { border: none; background: transparent; padding: 6px 4px; width: 170px; margin: 0; display: inline-block; }
  .sheet .taginput input:focus { outline: none; }
  #tagSuggest { display: none; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
  #tagSuggest .group { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 2px 0 6px; }
  #tagSuggest .opts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  #tagSuggest .opts:last-child { margin-bottom: 0; }
  #tagSuggest button { background: var(--field); border: 1px solid var(--line); color: var(--text); border-radius: 16px; padding: 4px 12px; font-size: 14px; }
  #tagSuggest button:hover { border-color: var(--accent); }
  #tagSuggest button.chosen { background: var(--tag-bg); color: var(--tag-text); border-color: transparent; cursor: default; }
  #tagSuggest .hint { margin-top: 2px; }
  #tagSuggest .group + .hint, #tagSuggest > .hint:first-child { margin-top: 0; }
  #tagSuggest b { color: var(--tag-text); background: var(--tag-bg); border-radius: 3px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

  /* Пункты задачи в окне */
  #subWrap { margin-bottom: 12px; }
  .subrow { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .subrow input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); flex-shrink: 0; cursor: pointer; }
  .sheet .subrow input[type=text] { margin: 0; flex: 1; padding: 8px 10px; }
  .subrow.done input[type=text] { text-decoration: line-through; color: var(--muted); }
  .subrow .rm { background: transparent; color: var(--muted); border: none; padding: 4px 8px; font-size: 20px; line-height: 1; }
  .subrow .rm:hover { color: var(--danger); }
  #addSubBtn { background: transparent; border: 1px dashed var(--field-line); color: var(--muted); border-radius: 10px; padding: 7px 14px; font-size: 15px; }
  #addSubBtn:hover { color: var(--text); border-color: var(--accent); }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .quick button { background: var(--field); border: 1px solid var(--line); color: var(--text); border-radius: 16px; padding: 5px 12px; font-size: 14px; }
  .quick button:hover { border-color: var(--accent); }
  .sheet .quick input[type=date] { margin: 0; }

  /* Пункты задачи в списке */
  .subs { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
  .sub { display: flex; gap: 9px; align-items: center; font-size: 15px; cursor: pointer; width: fit-content; max-width: 100%; }
  .sub input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
  .sub span { overflow-wrap: anywhere; }
  .sub.done span { text-decoration: line-through; color: var(--muted); }
  .more { font-size: 13px; color: var(--muted); }
  #dueWrap { margin-bottom: 10px; }
  #error { color: var(--danger); font-size: 14px; margin: -4px 0 10px; display: none; }
  .sheet-foot { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
  #saveBtn { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  #saveBtn:hover { background: var(--accent-hover); }
  #deleteBtn { background: transparent; color: var(--danger); border-color: var(--danger); margin-left: auto; }
  #confirm { display: none; width: 100%; align-items: center; gap: 10px; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid var(--line); }
  #yesDel { background: var(--danger); color: #fff; }
  #noDel { background: transparent; color: var(--text); border-color: var(--field-line); }

  /* ====== Оформление: перелив синий → фиолетовый, цвета хэштегов (вариант J2) ====== */

:root{--bg:#f3f4fb;--card:#fff;--card-hover:#fafaff;--text:#171a2c;--muted:#5d6280;--line:#e2e4f2;--field:#fff;--field-line:#cfd2e6;
 --accent:#5b4ce6;--accent-hover:#5b4ce6;--on-accent:#fff;--tabc:#5b4ce6;--barc:#22c55e;--shadow:0 6px 20px rgba(40,40,120,.08)}
[data-theme=dark]{--bg:#0b0c17;--card:#171a2e;--card-hover:#1c2036;--text:#e8e9f6;--muted:#9a9dbd;--line:#272b48;--field:#12152a;--field-line:#353a5e;
 --accent:#5b4ce6;--accent-hover:#5b4ce6;--on-accent:#fff;--tabc:#a99fff;--barc:#22c55e;--shadow:none}
.top{padding-top:0}
.toprow{background:linear-gradient(120deg,#2f62e8,#7c3aed);margin:0 -16px;padding:22px 16px 26px;color:#fff;border-radius:0 0 24px 24px}
[data-theme=dark] .toprow{background:linear-gradient(120deg,#1e3a8a,#4c1d95)}
.toprow h1{color:#fff} #themeBtn{color:#fff;border-color:rgba(255,255,255,.55)}
.tabs{background:var(--card);border:none;box-shadow:var(--shadow);border-radius:16px;margin-top:-14px;position:relative}
.tabs button{border-radius:12px}.tabs button.active{background:linear-gradient(120deg,#2f62e8,#7c3aed);color:#fff}
#addBtn{background:linear-gradient(120deg,#0e7490,#7c3aed,#db2777);color:#fff;border-radius:14px;box-shadow:0 6px 16px rgba(124,58,237,.28)}
#saveBtn{background:linear-gradient(120deg,#2f62e8,#7c3aed);color:#fff}
.card,.task{border-radius:18px}
.chips button.active{background:#5b4ce6;border-color:#5b4ce6;color:#fff}

.tag{font-weight:600}
.tag.c0{background:#e3ecff;color:#1f4fc4}.tag.c1{background:#dcf5e5;color:#11683a}.tag.c2{background:#fff0c7;color:#784800}
.tag.c3{background:#ffe1ee;color:#a11d58}.tag.c4{background:#ece4ff;color:#5a2ab4}.tag.c5{background:#d6f4f7;color:#08616d}
[data-theme=dark] .tag.c0{background:#1d2c55;color:#a9c2ff}[data-theme=dark] .tag.c1{background:#173a26;color:#8fe3ad}[data-theme=dark] .tag.c2{background:#3d3010;color:#ffd46b}
[data-theme=dark] .tag.c3{background:#43182c;color:#ff9fc7}[data-theme=dark] .tag.c4{background:#2c1f4d;color:#c8b2ff}[data-theme=dark] .tag.c5{background:#123a40;color:#86e3ee}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:9px;overflow:hidden;max-width:240px}.bar i{display:block;height:100%;border-radius:3px;background:var(--barc)}
.card.c0,.task.c0{box-shadow:inset 3px 0 0 #3b82f6}.card.c1,.task.c1{box-shadow:inset 3px 0 0 #84cc16}.card.c2,.task.c2{box-shadow:inset 3px 0 0 #f59e0b}
.card.c3,.task.c3{box-shadow:inset 3px 0 0 #ec4899}.card.c4,.task.c4{box-shadow:inset 3px 0 0 #a855f7}.card.c5,.task.c5{box-shadow:inset 3px 0 0 #06b6d4}
[data-theme=dark] .card.c0,[data-theme=dark] .task.c0{box-shadow:inset 3px 0 0 #3b82f6,0 0 18px rgba(59,130,246,.12)}
[data-theme=dark] .card.c1,[data-theme=dark] .task.c1{box-shadow:inset 3px 0 0 #84cc16,0 0 18px rgba(132,204,22,.12)}
[data-theme=dark] .card.c2,[data-theme=dark] .task.c2{box-shadow:inset 3px 0 0 #f59e0b,0 0 18px rgba(245,158,11,.12)}
[data-theme=dark] .card.c3,[data-theme=dark] .task.c3{box-shadow:inset 3px 0 0 #ec4899,0 0 18px rgba(236,72,153,.12)}
[data-theme=dark] .card.c4,[data-theme=dark] .task.c4{box-shadow:inset 3px 0 0 #a855f7,0 0 18px rgba(168,85,247,.12)}
[data-theme=dark] .card.c5,[data-theme=dark] .task.c5{box-shadow:inset 3px 0 0 #06b6d4,0 0 18px rgba(6,182,212,.12)}
.task.overdue{box-shadow:inset 3px 0 0 var(--danger)!important}

  :root { --tag-bg: #e3ecff; --tag-text: #1f4fc4; }
  [data-theme="dark"] { --tag-bg: #1d2c55; --tag-text: #a9c2ff; }
  #addBtn:hover { background: linear-gradient(120deg,#0e7490,#7c3aed,#db2777); filter: brightness(1.08); }
  #saveBtn:hover { background: linear-gradient(120deg,#2f62e8,#7c3aed); filter: brightness(1.08); }
  .chip.c0{background:#e3ecff;color:#1f4fc4}.chip.c1{background:#dcf5e5;color:#11683a}.chip.c2{background:#fff0c7;color:#784800}
  .chip.c3{background:#ffe1ee;color:#a11d58}.chip.c4{background:#ece4ff;color:#5a2ab4}.chip.c5{background:#d6f4f7;color:#08616d}
  [data-theme=dark] .chip.c0{background:#1d2c55;color:#a9c2ff}[data-theme=dark] .chip.c1{background:#173a26;color:#8fe3ad}[data-theme=dark] .chip.c2{background:#3d3010;color:#ffd46b}
  [data-theme=dark] .chip.c3{background:#43182c;color:#ff9fc7}[data-theme=dark] .chip.c4{background:#2c1f4d;color:#c8b2ff}[data-theme=dark] .chip.c5{background:#123a40;color:#86e3ee}

  /* ====== Ограничение длины на карточках ====== */
  .card .title, .task .title { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card .text { -webkit-line-clamp: 8; }
  .sub span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tag.more { background: var(--line); color: var(--muted); cursor: default; }
  .tag.more:hover { text-decoration: none; }

  /* ====== Выбранная кнопка срока ====== */
  .quick button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  @media (max-width: 600px) {
    h1 { font-size: 26px; }
    .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .card { padding: 14px; border-radius: 14px; }
    .overlay { padding: 0; align-items: stretch; }
    .sheet { max-width: none; border-radius: 0; min-height: 100%; }
    #addBtn { width: 100%; }
  }
</style>
</head>
<body>

<div class="wrap top">
  <div class="toprow">
    <h1 id="pageTitle">Заметки</h1>
    <button type="button" id="themeBtn">Тёмная тема</button>
  </div>

  <!-- Вкладки -->
  <div class="tabs" id="tabs">
    <button type="button" data-tab="note" class="active">Заметки <span class="num" id="numNotes"></span></button>
    <button type="button" data-tab="task">Задачи <span class="num" id="numTasks"></span></button>
  </div>

  <div id="warning">Браузер не даёт сохранять данные. Записи пропадут после закрытия страницы.</div>

  <!-- Поиск, категории, сортировка -->
  <div class="tools">
    <input type="text" id="search" placeholder="Поиск" aria-label="Поиск">
    <select id="catFilter" aria-label="Хэштег"><option value="">Все хэштеги</option></select>
    <select id="sort" aria-label="Сортировка">
      <option value="new">Сначала новые</option>
      <option value="old">Сначала старые</option>
      <option value="due">По сроку</option>
      <option value="abc">По алфавиту</option>
    </select>
  </div>

  <!-- Фильтры только для задач -->
  <div class="chips" id="taskFilters">
    <button type="button" data-f="all" class="active">Все</button>
    <button type="button" data-f="open">Невыполненные</button>
    <button type="button" data-f="done">Выполненные</button>
    <button type="button" data-f="late">Просроченные</button>
  </div>

  <div class="addrow">
    <div id="shown"></div>
    <button type="button" id="addBtn">Добавить заметку</button>
  </div>

  <div id="list"></div>
</div>

<!-- Окно добавления и изменения записи -->
<div class="overlay" id="editor" role="dialog" aria-modal="true" aria-labelledby="edTitle">
  <div class="sheet">
    <div class="sheet-head">
      <button type="button" id="backBtn">← Назад</button>
      <h2 id="edTitle">Новая заметка</h2>
    </div>
    <input type="text" id="title" placeholder="Заголовок" maxlength="120" aria-label="Заголовок">
    <div id="error">Введите заголовок.</div>
    <textarea id="text" placeholder="Текст" aria-label="Текст"></textarea>
    <!-- Подзадачи (например, список покупок) -->
    <div id="subWrap">
      <div id="subList"></div>
      <button type="button" id="addSubBtn">+ Добавить подзадачу</button>
      <div class="hint" id="subHint">или нажмите Enter в поле задачи</div>
    </div>
    <div id="dueWrap">
      <label for="due">Срок</label>
      <div class="quick">
        <input type="date" id="due">
        <button type="button" data-due="0">Сегодня</button>
        <button type="button" data-due="1">Завтра</button>
        <button type="button" data-due="">Без срока</button>
      </div>
    </div>
    <div class="label">Хэштеги</div>
    <div class="tagchips">
      <span id="selTags"></span>
      <button type="button" id="addTagBtn">+ Добавить хэштег</button>
      <span class="taginput" id="tagInputWrap"><span>#</span><input type="text" id="tagInput" maxlength="30" placeholder="хэштег" aria-label="Новый хэштег" autocomplete="off"></span>
    </div>
    <div id="tagSuggest"></div>
    <div class="sheet-foot">
      <button type="button" id="saveBtn">Сохранить</button>
      <button type="button" id="deleteBtn">Удалить</button>
      <div id="confirm">
        <span>Удалить запись?</span>
        <button type="button" id="yesDel">Да, удалить</button>
        <button type="button" id="noDel">Отмена</button>
      </div>
    </div>
  </div>
</div>

<script>
  // ====== 1. ДАННЫЕ ======
  // Все записи лежат в массиве items. Одна запись выглядит так:
  // { id: 1731580000000, type: 'note' или 'task', title: '...', text: '...',
  //   tags: ['учёба', 'важное'], done: false, created: '14.11.2026', due: '2026-11-20',
  //   subtasks: [{ text: 'апельсин', done: true }, { text: 'арбуз', done: false }] }
  // subtasks (пункты) бывают только у задач.
  // due (срок) есть только у задач; пустая строка — срока нет.
  // В старых версиях вместо tags было одно поле category — его переводим в хэштег.

  var KEY = 'notes_tasks_v1';          // записи
  var SORT_KEY = 'notes_tasks_sort';   // выбранная сортировка
  var THEME_KEY = 'notes_tasks_theme'; // выбранная тема
  var TAB_KEY = 'notes_tasks_tab';     // открытая вкладка
  var canSave = true;

  // Достаём записи из памяти браузера (localStorage)
  function load() {
    try {
      var saved = JSON.parse(localStorage.getItem(KEY));
      if (!Array.isArray(saved)) return [];
      return saved.filter(function (x) { return x && typeof x === 'object'; }).map(upgrade);
    } catch (e) {
      return [];
    }
  }

  // Кладём записи в память браузера
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(items));
    } catch (e) {
      canSave = false;
    }
    el('warning').style.display = canSave ? 'none' : 'block';
  }

  // Мелкие настройки (тема, сортировка, вкладка); если не сохранились — не страшно
  function saveSetting(key, value) {
    try { localStorage.setItem(key, value); } catch (e) {}
  }
  function loadSetting(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }

  var items = load();      // все записи
  var tab = 'note';        // открытая вкладка: 'note' или 'task'
  var taskFilter = 'all';  // фильтр задач
  var editId = null;       // id записи в окне (null — новая запись)
  var editType = 'note';   // что создаём в окне: заметку или задачу
  var editSubs = [];       // пункты задачи в открытом окне
  // У каждой вкладки свои настройки: сортировка (запоминается), хэштег и поиск
  var sortPref = { note: 'new', task: 'new' };
  var tabState = { note: { search: '', tag: '' }, task: { search: '', tag: '' } };

  function el(id) { return document.getElementById(id); }

  // ====== ХЭШТЕГИ ======
  // Готовые хэштеги, которые предлагаются, пока своих мало
  var BASE_TAGS = ['учёба', 'работа', 'дом', 'спорт', 'покупки', 'идеи', 'важное', 'срочно',
    'личное', 'семья', 'друзья', 'здоровье', 'финансы', 'планы', 'цели', 'встречи',
    'праздники', 'подарки', 'путешествия', 'книги', 'фильмы', 'музыка', 'рецепты', 'хобби',
    'тренировки', 'экзамены', 'проекты', 'ссылки'];
  var BASE_SHOWN = 12;   // сколько базовых показывать, пока ничего не введено
  var TAGS_KEY = 'notes_tasks_tags';   // хэштеги, которые человек вводил сам (запоминаются сразу)
  var myTags = loadMyTags();

  function loadMyTags() {
    try {
      var t = JSON.parse(localStorage.getItem(TAGS_KEY));
      return t && typeof t === 'object' && !Array.isArray(t) ? t : {};
    } catch (e) { return {}; }
  }

  // Запоминаем хэштег сразу, даже если запись потом не сохранили
  function rememberTag(t) {
    myTags[t] = Date.now();
    saveSetting(TAGS_KEY, JSON.stringify(myTags));
  }
  var MAX_TAGS = 10;     // не больше 10 хэштегов у одной записи
  var editTags = [];     // хэштеги записи в открытом окне
  var tagInputOpen = false;

  // Приводим хэштег к одному виду: без #, маленькими буквами, пробелы -> _
  function cleanTag(s) {
    return String(s).trim().replace(/^#+/, '').toLowerCase()
      .replace(/\s+/g, '_').replace(/[^0-9a-zа-яё_-]/gi, '').slice(0, 30);
  }

  // Запись из старой версии: категорию превращаем в хэштег
  function upgrade(x) {
    if (!Array.isArray(x.tags)) {
      var t = x.category ? cleanTag(x.category) : '';
      x.tags = t ? [t] : [];
    }
    delete x.category;
    if (typeof x.text !== 'string') x.text = '';
    if (typeof x.title !== 'string') x.title = String(x.title || '');
    if (!Array.isArray(x.subtasks)) x.subtasks = [];
    x.subtasks = x.subtasks.filter(function (s) { return s && typeof s.text === 'string'; })
      .map(function (s) { return { text: s.text, done: !!s.done }; });
    // У задач из старых версий был текст: превращаем его строки в пункты
    if (x.type === 'task' && x.text && !x.subtasks.length) {
      x.subtasks = x.text.split('\n').map(function (t) { return t.trim(); }).filter(Boolean)
        .map(function (t) { return { text: t, done: !!x.done }; });
      x.text = '';
    }
    return x;
  }

  // Цвет хэштега: каждый новый хэштег берёт следующий из 6 цветов (c0…c5)
  function tagColor(t) {
    var order = [];
    items.slice().sort(function (a, b) { return a.id - b.id; }).forEach(function (x) {
      x.tags.forEach(function (tag) { if (order.indexOf(tag) === -1) order.push(tag); });
    });
    Object.keys(myTags).sort(function (a, b) { return myTags[a] - myTags[b]; }).forEach(function (tag) {
      if (order.indexOf(tag) === -1) order.push(tag);
    });
    var i = order.indexOf(t);
    return 'c' + ((i < 0 ? order.length : i) % 6);
  }

  // Хэштеги, которые уже использовались или вводились: сначала недавние
  function usedTags() {
    var last = {};
    items.forEach(function (x) {
      x.tags.forEach(function (t) { if (!last[t] || x.id > last[t]) last[t] = x.id; });
    });
    Object.keys(myTags).forEach(function (t) {
      var c = cleanTag(t);
      if (c && (!last[c] || myTags[t] > last[c])) last[c] = myTags[t];
    });
    return Object.keys(last).sort(function (a, b) { return last[b] - last[a]; });
  }

  // Превращаем спецсимволы в безопасный текст, чтобы запись не могла сломать страницу
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function findItem(id) {
    for (var i = 0; i < items.length; i++) {
      if (items[i].id === id) return items[i];
    }
    return null;
  }

  // ====== 2. ДАТЫ ======

  // Сегодня в виде '2026-11-14' (так же хранится срок)
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  // '2026-11-20' -> '20.11.2026'
  function showDate(s) {
    var p = s.split('-');
    return p[2] + '.' + p[1] + '.' + p[0];
  }

  // Просрочена: срок прошёл, а галочки нет
  function isLate(x) {
    return x.type === 'task' && !x.done && !!x.due && x.due < todayStr();
  }

  // ====== 3. ОКНО ДОБАВЛЕНИЯ И ИЗМЕНЕНИЯ ======

  // Открыть окно. id = null — новая запись, иначе — изменение записи
  function openEditor(id) {
    var item = id ? findItem(id) : null;
    editId = item ? item.id : null;
    editType = item ? item.type : tab;
    var isTask = editType === 'task';

    el('edTitle').textContent = item ? (isTask ? 'Задача' : 'Заметка') : (isTask ? 'Новая задача' : 'Новая заметка');
    el('title').value = item ? item.title : '';
    el('title').placeholder = isTask ? 'Задача' : 'Заголовок';
    el('text').value = item ? item.text : '';
    el('text').style.display = isTask ? 'none' : 'block';
    el('subWrap').style.display = isTask ? 'block' : 'none';
    editSubs = item ? item.subtasks.map(function (s) { return { text: s.text, done: s.done }; }) : [];
    renderSubs();
    editTags = item ? item.tags.slice() : (el('catFilter').value ? [el('catFilter').value] : []);
    closeTagInput();
    el('due').value = item && item.due ? item.due : '';
    el('dueWrap').style.display = isTask ? 'block' : 'none';
    updateQuick();
    el('deleteBtn').style.display = item ? '' : 'none';
    el('error').style.display = 'none';
    el('confirm').style.display = 'none';

    el('editor').classList.add('open');
    document.body.style.overflow = 'hidden';
    el('title').focus();
  }

  function closeEditor() {
    el('editor').classList.remove('open');
    document.body.style.overflow = '';
    editId = null;
    tagInputOpen = false;
  }

  // --- пункты задачи в окне ---

  function renderSubs() {
    el('subList').innerHTML = editSubs.map(function (s, i) {
      return '<div class="subrow' + (s.done ? ' done' : '') + '" data-i="' + i + '">' +
        '<input type="checkbox" aria-label="Подзадача выполнена"' + (s.done ? ' checked' : '') + '>' +
        '<input type="text" maxlength="120" placeholder="Подзадача" aria-label="Подзадача" value="' + esc(s.text) + '">' +
        '<button type="button" class="rm" aria-label="Убрать подзадачу">×</button></div>';
    }).join('');
    el('subHint').style.display = editSubs.length ? 'none' : 'block';
  }

  function focusSub(i) {
    var inputs = el('subList').querySelectorAll('input[type=text]');
    if (inputs[i]) inputs[i].focus();
  }

  // Новый пункт после пункта номер i (i = -1 — в самое начало)
  function addSub(i) {
    editSubs.splice(i + 1, 0, { text: '', done: false });
    renderSubs();
    focusSub(i + 1);
  }

  function removeSub(i) {
    editSubs.splice(i, 1);
    renderSubs();
    if (i > 0) focusSub(i - 1); else el('title').focus();
  }

  // --- хэштеги в окне ---

  // Показываем выбранные хэштеги, кнопку «Добавить» или поле ввода
  function renderTagEditor() {
    el('selTags').innerHTML = editTags.map(function (t) {
      return '<span class="chip ' + tagColor(t) + '">#' + esc(t) + '<button type="button" data-rm="' + esc(t) + '" aria-label="Убрать #' + esc(t) + '">×</button></span>';
    }).join('');
    var full = editTags.length >= MAX_TAGS;
    el('addTagBtn').style.display = tagInputOpen || full ? 'none' : '';
    el('tagInputWrap').style.display = tagInputOpen && !full ? 'inline-flex' : 'none';
    renderSuggest();
  }

  // Подсказки: пустое поле — недавние и базовые; есть буквы — подходящие по началу
  function renderSuggest() {
    var box = el('tagSuggest');
    if (!tagInputOpen || editTags.length >= MAX_TAGS) { box.style.display = 'none'; return; }
    var q = cleanTag(el('tagInput').value);
    var free = function (t) { return editTags.indexOf(t) === -1; };
    var btn = function (t, label, cls) {
      return '<button type="button" data-tag="' + esc(t) + '"' + (cls ? ' class="' + cls + '"' : '') + '>' + label + '</button>';
    };
    var html = '';

    if (!q) {
      var recent = usedTags().filter(free).slice(0, 10);
      var base = BASE_TAGS.filter(function (t) { return free(t) && recent.indexOf(t) === -1; }).slice(0, BASE_SHOWN);
      if (recent.length) html += '<div class="group">Вы использовали</div><div class="opts">' + recent.map(function (t) { return btn(t, '#' + esc(t)); }).join('') + '</div>';
      if (base.length) html += '<div class="group">Популярные</div><div class="opts">' + base.map(function (t) { return btn(t, '#' + esc(t)); }).join('') + '</div>';
    } else {
      var all = usedTags();
      BASE_TAGS.forEach(function (t) { if (all.indexOf(t) === -1) all.push(t); });
      editTags.forEach(function (t) { if (all.indexOf(t) === -1) all.push(t); });
      var starts = all.filter(function (t) { return t.indexOf(q) === 0; });
      var inside = all.filter(function (t) { return t.indexOf(q) > 0; });
      var found = starts.concat(inside).slice(0, 10);
      var opts = found.map(function (t) {
        var i = t.indexOf(q);
        var label = '#' + esc(t.slice(0, i)) + '<b>' + esc(t.slice(i, i + q.length)) + '</b>' + esc(t.slice(i + q.length));
        // уже добавленный показываем с галочкой, нажать нельзя
        if (!free(t)) return '<button type="button" class="chosen" disabled>✓ ' + label + '</button>';
        return btn(t, label);
      });
      if (opts.length) html += '<div class="group">Подходят</div><div class="opts">' + opts.join('') + '</div>';
      if (found.indexOf(q) === -1) html += '<div class="hint">Enter — добавить #' + esc(q) + '</div>';
    }
    box.innerHTML = html;
    box.style.display = html ? 'block' : 'none';
  }

  function openTagInput() {
    tagInputOpen = true;
    el('tagInput').value = '';
    renderTagEditor();
    el('tagInput').focus();
  }

  function closeTagInput() {
    tagInputOpen = false;
    el('tagInput').value = '';
    renderTagEditor();
  }

  function addTag(raw) {
    var t = cleanTag(raw);
    if (t && editTags.indexOf(t) === -1 && editTags.length < MAX_TAGS) {
      editTags.push(t);
      rememberTag(t);
    }
    if (editTags.length >= MAX_TAGS) tagInputOpen = false;   // больше добавить нельзя
    el('tagInput').value = '';
    renderTagEditor();
    if (tagInputOpen && editTags.length < MAX_TAGS) el('tagInput').focus();
  }

  function removeTag(t) {
    editTags = editTags.filter(function (x) { return x !== t; });
    renderTagEditor();
  }

  // Кнопка «Сохранить»
  function saveEditor() {
    var title = el('title').value.trim();
    if (!title) {
      el('error').style.display = 'block';
      el('title').focus();
      return;
    }
    if (el('tagInput').value.trim()) addTag(el('tagInput').value);   // не забываем недописанный хэштег
    var isTask = editType === 'task';
    var subs = isTask ? editSubs.filter(function (s) { return s.text.trim(); })
      .map(function (s) { return { text: s.text.trim(), done: s.done }; }) : [];
    var allDone = subs.length > 0 && subs.every(function (s) { return s.done; });
    var data = {
      title: title,
      text: isTask ? '' : el('text').value.trim(),
      subtasks: subs,
      tags: editTags.slice(),
      due: editType === 'task' ? el('due').value : ''
    };

    if (editId) {
      var item = findItem(editId);
      if (item) {
        item.title = data.title;
        item.text = data.text;
        item.tags = data.tags;
        item.due = data.due;
        item.subtasks = data.subtasks;
        if (subs.length) item.done = allDone;   // все пункты отмечены — задача выполнена
      }
    } else {
      items.unshift({
        id: Date.now(),
        type: editType,
        title: data.title,
        text: data.text,
        tags: data.tags,
        subtasks: data.subtasks,
        done: allDone,
        created: new Date().toLocaleDateString('ru-RU'),
        due: data.due
      });
    }
    save();
    closeEditor();
    render();
  }

  // Удаление: сначала спрашиваем, потом удаляем
  function askDelete() {
    el('confirm').style.display = 'flex';
  }
  function removeItem() {
    var id = editId;
    items = items.filter(function (x) { return x.id !== id; });
    save();
    closeEditor();
    render();
  }

  // Галочка у задачи: отмечает и все её пункты
  function toggleDone(id) {
    var item = findItem(id);
    if (!item) return;
    item.done = !item.done;
    item.subtasks.forEach(function (s) { s.done = item.done; });
    save();
    render();
  }

  // Галочка у пункта прямо в списке; все пункты отмечены — задача выполнена
  function toggleSub(id, i) {
    var item = findItem(id);
    if (!item || !item.subtasks[i]) return;
    item.subtasks[i].done = !item.subtasks[i].done;
    item.done = item.subtasks.every(function (s) { return s.done; });
    save();
    render();
  }

  // ====== 4. ОТБОР И СОРТИРОВКА ======

  // Хэштеги записей открытой вкладки — для фильтра
  function updateCategories() {
    var mine = [];
    items.forEach(function (x) {
      if (x.type !== tab) return;
      x.tags.forEach(function (t) { if (mine.indexOf(t) === -1) mine.push(t); });
    });
    mine.sort(function (a, b) { return a.localeCompare(b, 'ru'); });

    var chosen = tabState[tab].tag;
    el('catFilter').innerHTML = '<option value="">Все хэштеги</option>' + mine.map(function (c) {
      return '<option value="' + esc(c) + '">#' + esc(c) + '</option>';
    }).join('');
    if (mine.indexOf(chosen) === -1) chosen = '';   // хэштег пропал (записи удалили) — сбрасываем
    tabState[tab].tag = chosen;
    el('catFilter').value = chosen;
  }

  function matches(x) {
    if (x.type !== tab) return false;
    if (tab === 'task') {
      if (taskFilter === 'open' && x.done) return false;
      if (taskFilter === 'done' && !x.done) return false;
      if (taskFilter === 'late' && !isLate(x)) return false;
    }
    var cat = el('catFilter').value;
    if (cat && x.tags.indexOf(cat) === -1) return false;
    var q = el('search').value.trim().toLowerCase();
    var where = x.title + ' ' + x.text + ' ' + x.subtasks.map(function (s) { return s.text; }).join(' ') + ' #' + x.tags.join(' #');
    if (q && where.toLowerCase().indexOf(q) === -1) return false;
    return true;
  }

  function compare(a, b) {
    var mode = el('sort').value;
    if (mode === 'old') return a.id - b.id;
    if (mode === 'abc') return a.title.localeCompare(b.title, 'ru');
    if (mode === 'due' && tab === 'task') {
      // со сроком — по дате, без срока — в конце
      if (a.due && b.due) return a.due < b.due ? -1 : (a.due > b.due ? 1 : b.id - a.id);
      if (a.due) return -1;
      if (b.due) return 1;
    }
    return b.id - a.id;   // сначала новые
  }

  // ====== 5. ВЫВОД НА СТРАНИЦУ ======

  // Хэштеги на карточке; нажатие на хэштег показывает все записи с ним
  var TAGS_ON_CARD = 3;   // сколько хэштегов видно на карточке, остальные — «…»
  function tagsHtml(x) {
    var html = x.tags.slice(0, TAGS_ON_CARD).map(function (t) {
      return '<span class="tag ' + tagColor(t) + '" data-tag="' + esc(t) + '" title="Показать все с #' + esc(t) + '">#' + esc(t) + '</span>';
    }).join('');
    if (x.tags.length > TAGS_ON_CARD) {
      var rest = x.tags.slice(TAGS_ON_CARD).map(function (t) { return '#' + t; }).join(' ');
      html += '<span class="tag more" title="' + esc(rest) + '">…</span>';
    }
    return html;
  }

  // Цвет полосы карточки — по первому хэштегу
  function stripe(x) {
    return x.tags.length ? ' ' + tagColor(x.tags[0]) : '';
  }

  function noteHtml(x) {
    var html = '<div class="card' + stripe(x) + '" tabindex="0" role="button" data-id="' + x.id + '">';
    html += '<div class="title">' + esc(x.title) + '</div>';
    if (x.text) html += '<div class="text">' + esc(x.text) + '</div>';
    html += '<div class="meta"><span>' + esc(x.created || '') + '</span>' + tagsHtml(x);
    html += '</div></div>';
    return html;
  }

  function taskHtml(x) {
    var late = isLate(x);
    var html = '<div class="task' + stripe(x) + (x.done ? ' done' : '') + (late ? ' overdue' : '') + '" tabindex="0" role="button" data-id="' + x.id + '">';
    html += '<input type="checkbox" class="main" aria-label="Выполнено" title="Отметить выполненной"' + (x.done ? ' checked' : '') + '>';
    html += '<div class="body"><div class="title">' + esc(x.title) + '</div>';
    if (x.text) html += '<div class="text">' + esc(x.text) + '</div>';
    if (x.subtasks.length) {
      var SHOW = 6;
      html += '<ul class="subs">' + x.subtasks.slice(0, SHOW).map(function (s, i) {
        return '<li><label class="sub' + (s.done ? ' done' : '') + '"><input type="checkbox" data-sub="' + i + '"' + (s.done ? ' checked' : '') + '><span>' + esc(s.text) + '</span></label></li>';
      }).join('') + '</ul>';
      if (x.subtasks.length > SHOW) html += '<div class="more">и ещё ' + (x.subtasks.length - SHOW) + '…</div>';
    }
    var ready = x.subtasks.filter(function (s) { return s.done; }).length;
    if (x.subtasks.length) {
      html += '<div class="bar" title="Выполнено ' + ready + ' из ' + x.subtasks.length + '"><i style="width:' +
        Math.round(100 * ready / x.subtasks.length) + '%"></i></div>';
    }
    html += '<div class="meta">';
    if (x.subtasks.length) html += '<span>' + ready + ' из ' + x.subtasks.length + '</span>';
    html += tagsHtml(x);
    if (x.due) {
      if (late) html += '<span class="due late">Просрочено: ' + showDate(x.due) + '</span>';
      else if (!x.done && x.due === todayStr()) html += '<span class="due today">Срок сегодня</span>';
      else html += '<span class="due">Срок: ' + showDate(x.due) + '</span>';
    }
    if (x.done) html += '<span>Выполнено</span>';
    html += '</div></div></div>';
    return html;
  }

  function render() {
    var isTask = tab === 'task';
    updateCategories();

    // заголовок, вкладки, кнопка
    el('pageTitle').textContent = isTask ? 'Задачи' : 'Заметки';
    document.querySelectorAll('#tabs button').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-tab') === tab);
    });
    el('addBtn').textContent = isTask ? 'Добавить задачу' : 'Добавить заметку';
    el('taskFilters').style.display = isTask ? 'flex' : 'none';
    el('sort').querySelector('option[value="due"]').hidden = !isTask;
    el('sort').value = (!isTask && sortPref[tab] === 'due') ? 'new' : sortPref[tab];   // в заметках сроков нет

    // числа на вкладках
    var notes = 0, tasks = 0, open = 0;
    items.forEach(function (x) {
      if (x.type === 'task') { tasks++; if (!x.done) open++; } else { notes++; }
    });
    el('numNotes').textContent = notes ? '(' + notes + ')' : '';
    el('numTasks').textContent = tasks ? '(' + open + ' из ' + tasks + ')' : '';

    // отбираем, сортируем; выполненные задачи — вниз
    var total = isTask ? tasks : notes;
    var shown = items.filter(matches).sort(compare);
    if (isTask) {
      shown = shown.filter(function (x) { return !x.done; }).concat(shown.filter(function (x) { return x.done; }));
    }

    var list = el('list');
    list.className = isTask ? 'tasklist' : 'grid';
    if (total === 0) {
      el('shown').textContent = '';
      list.className = '';
      list.innerHTML = '<div class="empty">' + (isTask ? 'Задач пока нет. Нажмите «Добавить задачу».' : 'Заметок пока нет. Нажмите «Добавить заметку».') + '</div>';
      return;
    }
    var lateCount = items.filter(isLate).length;
    el('shown').textContent = 'Показано: ' + shown.length + ' из ' + total + (isTask && lateCount ? ' · просрочено: ' + lateCount : '');
    if (shown.length === 0) {
      list.className = '';
      list.innerHTML = '<div class="empty">Ничего не найдено.</div>';
      return;
    }
    list.innerHTML = shown.map(isTask ? taskHtml : noteHtml).join('');
  }

  // ====== 6. ВКЛАДКИ И ТЕМА ======

  // Переключение вкладки: настройки старой вкладки запоминаем, новой — возвращаем
  function setTab(t) {
    tabState[tab].search = el('search').value;
    tab = t === 'task' ? 'task' : 'note';
    saveSetting(TAB_KEY, tab);
    el('search').value = tabState[tab].search;
    render();
  }

  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    el('themeBtn').textContent = t === 'dark' ? 'Светлая тема' : 'Тёмная тема';
  }

  // ====== 7. ПОДКЛЮЧАЕМ КНОПКИ ======

  document.querySelectorAll('#tabs button').forEach(function (b) {
    b.onclick = function () { setTab(b.getAttribute('data-tab')); };
  });

  var filterButtons = document.querySelectorAll('#taskFilters button');
  filterButtons.forEach(function (b) {
    b.onclick = function () {
      taskFilter = b.getAttribute('data-f');
      filterButtons.forEach(function (x) { x.classList.toggle('active', x === b); });
      render();
    };
  });

  el('search').oninput = function () { tabState[tab].search = el('search').value; render(); };
  el('catFilter').onchange = function () { tabState[tab].tag = el('catFilter').value; render(); };
  el('sort').onchange = function () {
    sortPref[tab] = el('sort').value;
    saveSetting(SORT_KEY, JSON.stringify(sortPref));
    render();
  };
  el('addBtn').onclick = function () { openEditor(null); };

  // Нажатие на заметку или задачу открывает её; галочка — отмечает выполнение
  el('list').addEventListener('click', function (e) {
    var tagEl = e.target.closest('.tag[data-tag]');
    if (tagEl) {
      tabState[tab].tag = tagEl.getAttribute('data-tag');
      render();
      return;
    }
    var box = e.target.closest('[data-id]');
    if (!box) return;
    var id = Number(box.getAttribute('data-id'));
    // пункт задачи: галочку обрабатываем, саму задачу не открываем
    if (e.target.closest('.sub')) {
      if (e.target.matches('input[data-sub]')) toggleSub(id, Number(e.target.getAttribute('data-sub')));
      return;
    }
    if (e.target.matches('input.main')) { toggleDone(id); return; }
    openEditor(id);
  });
  el('list').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || e.target.matches('input')) return;
    var box = e.target.closest('[data-id]');
    if (box) openEditor(Number(box.getAttribute('data-id')));
  });

  el('saveBtn').onclick = saveEditor;
  el('backBtn').onclick = closeEditor;
  el('deleteBtn').onclick = askDelete;
  el('yesDel').onclick = removeItem;
  el('noDel').onclick = function () { el('confirm').style.display = 'none'; };
  el('title').oninput = function () { el('error').style.display = 'none'; };
  // Enter в заголовке: у заметки — сохранить, у задачи — перейти к пунктам
  el('title').onkeydown = function (e) {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    if (editType === 'task') {
      if (editSubs.length) focusSub(0); else addSub(-1);
    } else {
      saveEditor();
    }
  };

  // пункты задачи
  el('addSubBtn').onclick = function () { addSub(editSubs.length - 1); };
  el('subList').addEventListener('input', function (e) {
    var row = e.target.closest('.subrow');
    if (row && e.target.type === 'text') editSubs[Number(row.getAttribute('data-i'))].text = e.target.value;
  });
  el('subList').addEventListener('change', function (e) {
    var row = e.target.closest('.subrow');
    if (row && e.target.type === 'checkbox') {
      editSubs[Number(row.getAttribute('data-i'))].done = e.target.checked;
      row.classList.toggle('done', e.target.checked);
    }
  });
  el('subList').addEventListener('click', function (e) {
    var row = e.target.closest('.subrow');
    if (row && e.target.classList.contains('rm')) removeSub(Number(row.getAttribute('data-i')));
  });
  el('subList').addEventListener('keydown', function (e) {
    var row = e.target.closest('.subrow');
    if (!row || e.target.type !== 'text') return;
    var i = Number(row.getAttribute('data-i'));
    if (e.key === 'Enter') {           // Enter — следующий пункт
      e.preventDefault();
      addSub(i);
    } else if (e.key === 'Backspace' && !e.target.value) {   // стёрли пустой пункт
      e.preventDefault();
      removeSub(i);
    }
  });

  // быстрый выбор срока
  function dayStr(plus) {
    var d = new Date();
    d.setDate(d.getDate() + plus);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  // подсвечиваем кнопку, которая совпадает с выбранной датой
  function updateQuick() {
    var v = el('due').value;
    document.querySelectorAll('#dueWrap .quick button').forEach(function (b) {
      var days = b.getAttribute('data-due');
      var match = days === '' ? v === '' : v === dayStr(Number(days));
      b.classList.toggle('active', match);
      b.setAttribute('aria-pressed', match ? 'true' : 'false');
    });
  }
  document.querySelectorAll('#dueWrap .quick button').forEach(function (b) {
    b.onclick = function () {
      var days = b.getAttribute('data-due');
      el('due').value = days === '' ? '' : dayStr(Number(days));
      updateQuick();
    };
  });
  el('due').addEventListener('input', updateQuick);
  el('due').addEventListener('change', updateQuick);
  el('editor').addEventListener('click', function (e) { if (e.target === el('editor')) closeEditor(); });

  // хэштеги в окне
  el('addTagBtn').onclick = openTagInput;
  el('tagInput').oninput = renderSuggest;
  el('tagInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ',') {
      e.preventDefault();
      if (el('tagInput').value.trim()) addTag(el('tagInput').value); else closeTagInput();
    } else if (e.key === 'Backspace' && !el('tagInput').value && editTags.length) {
      removeTag(editTags[editTags.length - 1]);
    } else if (e.key === 'Escape') {
      e.stopPropagation();   // Esc закрывает только поле хэштега, а не всё окно
      closeTagInput();
      el('addTagBtn').focus();
    }
  });
  el('tagInput').addEventListener('blur', function () {
    setTimeout(function () {
      if (!tagInputOpen || document.activeElement === el('tagInput')) return;
      if (el('tagInput').value.trim()) addTag(el('tagInput').value);
      closeTagInput();
    }, 150);
  });
  // нажатие на подсказку не должно уводить курсор из поля
  el('tagSuggest').addEventListener('mousedown', function (e) { e.preventDefault(); });
  el('tagSuggest').addEventListener('click', function (e) {
    var b = e.target.closest('[data-tag]');
    if (b) addTag(b.getAttribute('data-tag'));
  });
  el('selTags').addEventListener('click', function (e) {
    var b = e.target.closest('[data-rm]');
    if (b) removeTag(b.getAttribute('data-rm'));
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && el('editor').classList.contains('open')) closeEditor();
  });

  // Восстанавливаем вкладку, сортировку и тему
  tab = loadSetting(TAB_KEY) === 'task' ? 'task' : 'note';
  // Сортировка: новая запись — {note:…, task:…}; старая версия хранила одну строку на обе вкладки
  (function () {
    var ok = function (v) { return ['new', 'old', 'due', 'abc'].indexOf(v) !== -1; };
    var raw = loadSetting(SORT_KEY), saved = null;
    try { saved = JSON.parse(raw); } catch (e) { saved = raw; }
    if (saved && typeof saved === 'object') {
      if (ok(saved.note) && saved.note !== 'due') sortPref.note = saved.note;
      if (ok(saved.task)) sortPref.task = saved.task;
    } else if (ok(saved)) {
      sortPref.task = saved;
      sortPref.note = saved === 'due' ? 'new' : saved;
    }
  })();
  setTheme(document.documentElement.getAttribute('data-theme'));
  el('themeBtn').onclick = function () {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    setTheme(next);
    saveSetting(THEME_KEY, next);
  };

  // Если сайт открыт в двух вкладках браузера, подхватываем изменения из другой
  window.addEventListener('storage', function (e) {
    if (e.key === TAGS_KEY) myTags = loadMyTags();
    if (e.key === KEY) {
      items = load();
      if (editId && !findItem(editId)) closeEditor();
      render();
    }
  });

  render();
</script>
</body>
</html>
